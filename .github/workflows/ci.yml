# .github/workflows/ci.yml
name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # verificar versión (idealmente pin por SHA)
      - run: pip install uv # verificar versión
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy installer/src
      - run: uv run lint-imports
      - run: uv run pytest -q installer
      - run: uv run pip-audit

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # verificar versión
      - run: rustup show # toolchain desde rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -q
      - run: cargo install cargo-deny --locked && cargo deny check

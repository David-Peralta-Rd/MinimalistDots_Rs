[workspace]
resolver = "3"
members = ["md", "md-core"]

[workspace.lints.rust]
# `deny` (y no `forbid`) porque el código generado por Slint usa `unsafe` interno
# protegido con `#[allow(unsafe_code)]`; `forbid` lo anularía y rompería la build.
# Nuestro propio código sigue sin poder usar `unsafe` sin un `allow` explícito.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

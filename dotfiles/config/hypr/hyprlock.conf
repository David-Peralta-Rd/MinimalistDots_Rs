general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.015
    contrast = 0.8916
    brightness = 0.70
    color = rgba(1e222acc)
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(abb2bfff)
    font_size = 80
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
}
label {
    monitor =
    text = Hola, $USER
    color = rgba(abb2bfcc)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Regular
    position = 0, -40
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 250, 45
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(4b5263aa)
    check_color = rgba(7aa2f7ff)
    fail_color = rgba(e06c75ff)
    inner_color = rgba(282c34ff)
    font_color = rgba(abb2bfff)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <i>Ingresa contraseña / Enter password...</i>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}
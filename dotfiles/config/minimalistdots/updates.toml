[[novedad]]
titulo = "IA: skills y bootstrap de proyectos"
descripcion = "`md ai new` ahora instala skills por defecto (project-architect, find-skills, tdd, code-review, architecture, debugging) y crea `REQUIREMENTS.md` + `/bootstrap` para generar SPEC, arquitectura, tareas y primer test automáticamente."

[[novedad]]
titulo = "Grabación de pantalla arreglada"
descripcion = "Se corrigió la dependencia de libplacebo/mpv para que `md record` vuelva a funcionar."

[[novedad]]
titulo = "IA: plantillas de proyecto"
descripcion = "Las plantillas de `md ai new` ahora incluyen documentación y estructura profesional (arquitectura, datos, seguridad, módulos)."

[[novedad]]
titulo = "Aliases de Zsh corregidos"
descripcion = "El alias `md` de oh-my-zsh ya no eclipsa el binario `md`; `ai-new`, `ai-code` y el resto funcionan."

[[novedad]]
titulo = "IA local"
descripcion = "Elige modelos, descarga .gguf y levanta llama-server con `md ai toggle`."
# Step 3: backup and installation of configs.
[dotfiles]
comenzando_backup = "CREATING BACKUP FOR CONFIGURATIONS INSIDE '~/.config'"
encabezado = "INSTALLING ADDITIONAL CONFIGURATIONS"
confirmacion = "THIS WILL REPLACE EXISTING CONFIGURATIONS (WITH PREVIOUS BACKUP). CONTINUE?"

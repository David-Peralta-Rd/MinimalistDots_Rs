[meta]
codigo = "en"
nombre = "English"

# Shared messages across steps (transversal errors and notices).
[comun]
configuracion_no_encontrada = "CONFIGURATION NOT FOUND"
paso_fallido = "❌ STEP FAILED:"
instalacion_con_errores = "⚠️ THE INSTALLATION FINISHED WITH ERRORS. CHECK THE ❌ MESSAGES ABOVE."

# General orchestration (steps.sh).
[instalador]
bienvenido = "WELCOME TO THE MINIMALISTDOTS INSTALLATION"
recarga = "🔄 RELOADING HYPRLAND"
recarga_error = "❌ ERROR RELOADING THE SYSTEM"
recarga_exito = "✅ RELOADED SUCCESSFULLY"
no_sesion = "ℹ️ NO ACTIVE HYPRLAND SESSION FOUND"

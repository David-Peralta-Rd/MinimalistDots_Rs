cancelado = "CANCELLED. NO CHANGES WERE MADE."
backup_si_existe = "🔄 BACKUP OF"
limpiando_destino = "🗑️ CLEANING PREVIOUS DESTINATION:"
paquete_detectado = "✨ NEW PACKAGE DETECTED:"
copiando_paquete = "📂 COPYING"
configurando_especificos = "⚙️ CONFIGURING HYPRLAND SPECIFIC FILES..."

# Sub-step: Zsh.
[zsh]
instalado = "==> Zsh configuration completed."

# Sub-step: process manager.
[procesos]
instalado = "==> Process Manager successfully installed in"

# Sub-step: SDDM theme.
[sddm]
version_reciente = "==> Checking the latest theme version..."
descarga = "==> Downloading and installing"
instalado = "==> SDDM theme configured correctly."

# Sub-step: Docker.
[docker]
funciona = "✅ DOCKER WORKS WITHOUT SUDO FOR USER"
sin_respuesta = "⚠️ DOCKER IS CONFIGURED BUT DOES NOT RESPOND YET. LOG OUT AND IN AGAIN, THEN TRY: docker info"

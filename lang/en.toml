# Step 0: sudo session.
[sudo]
configurando_sudo = "CONFIGURING THE SUDO SESSION FOR THE INSTALLATION"
no_root = "❌ ERROR: THIS INSTALLER MUST BE RUN AS A NORMAL USER (WITH SUDO), NOT AS ROOT."

borrando_scripts_antiguos = "删除 '~/.local/bin/MinimalistDots/scripts' 中的旧脚本"
copiando_scripts_nuevos = "复制新脚本到 '~/.local/bin/MinimalistDots/scripts'"

# Sub-step: Zsh.
[zsh]
instalado = "==> Zsh 配置已完成。"

# Sub-step: process manager.
[procesos]
instalado = "==> 进程管理器已成功安装到"

# Sub-step: SDDM theme.
[sddm]
version_reciente = "==> 检查主题的最新版本..."
descarga = "==> 下载并安装"
instalado = "==> SDDM 主题配置正确。"

# Sub-step: Docker.
[docker]
funciona = "✅ DOCKER 可供用户无 sudo 使用"

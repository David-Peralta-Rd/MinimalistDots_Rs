[meta]
codigo = "zh"
nombre = "中文"

# Shared messages across steps (transversal errors and notices).
[comun]
configuracion_no_encontrada = "未找到配置"
paso_fallido = "❌ 步骤失败："
instalacion_con_errores = "⚠️ 安装完成但有错误。请检查上面的 ❌ 消息。"

# General orchestration (steps.sh).
[instalador]
bienvenido = "欢迎使用 MINIMALISTDOTS 安装程序"
recarga = "🔄 重新加载 HYPRLAND"
recarga_error = "❌ 重新加载系统失败"
recarga_exito = "✅ 重新加载成功"
no_sesion = "ℹ️ 未找到活动的 HYPRLAND 会话"
configuraciones_listas = "✨ 备份完成，配置已适配"

# Step 0: sudo session.
[sudo]
configurando_sudo = "为安装配置 SUDO 会话"
no_root = "❌ 错误：此安装程序必须以普通用户（使用 sudo）运行，不能以 root 运行。"
invalido = "❌ 错误：无法验证 sudoers 配置。"

# Step 1: folder creation.
[carpetas]
nuevas_carpetas = "创建 dotfiles 使用的文件夹"
nombre_de_carpeta = "新文件夹已创建 == "

# Step 1b: language catalog deployment (for `md` at runtime).
[idioma]
desplegando = "复制语言目录"

# Step 2: package installation.
[paquetes]
instalando_paquetes = "安装已记录的软件包列表"
instalando_paru = "==> 'paru' 不在软件源中，从 AUR 构建..."

# Step 3: backup and installation of configs.
[dotfiles]
comenzando_backup = "为 '~/.config' 内的配置创建备份"
encabezado = "安装额外配置"
confirmacion = "这将替换现有配置（并先备份）。是否继续？"
letra_confirmacion = "Y"
cancelado = "已取消。未做任何更改。"
backup_si_existe = "🔄 备份"
limpiando_destino = "🗑️ 清理之前的目录："
paquete_detectado = "✨ 检测到新软件包："
copiando_paquete = "📂 复制"
configurando_especificos = "⚙️ 配置 HYPRLAND 专用文件..."
custom_restaurado = "♻️ 已恢复自定义覆盖到"

# Step 4: services and scripts.
[servicios]
instalando = "开始安装服务和脚本"
listando_servicios_antiguos = "这是将从 '~/.local/bin/MinimalistDots/services' 删除的旧服务列表："

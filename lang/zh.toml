reiniciar_sesion = "ℹ️ 要在已打开的终端中使用：注销（或重启）或运行 'newgrp docker'。"

# Sub-step: Git and GitHub.
[github]
sin_terminal = "无交互终端：已跳过 GitHub 设置。"
pregunta = "现在设置 Git 和 GitHub 吗？"
omitido = "已跳过。稍后可使用以下命令："
pedir_nombre = "全名"
pedir_correo = "GitHub 邮箱"
datos_obligatorios = "❌ 姓名和邮箱为必填项。"
sesion_activa = "已有活动的 GitHub 会话。"

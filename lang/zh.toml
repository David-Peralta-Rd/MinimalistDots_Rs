# Sub-step: Zsh.
[zsh]
instalado = "==> Zsh 配置已完成。"

# Sub-step: process manager.
[procesos]
instalado = "==> 进程管理器已成功安装到"

# Sub-step: SDDM theme.
[sddm]
version_reciente = "==> 检查主题的最新版本..."
descarga = "==> 下载并安装"

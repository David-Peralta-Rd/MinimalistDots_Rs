# Sub-step: network optimization.
[red]
iniciando = "⚡ 开始网络优化..."
sin_interfaz = "❌ 错误：无法检测到活动的网络接口。"
interfaz_detectada = "🌐 检测到活动接口："
aplicando_sysctl = "📦 应用内核设置 (SYSCTL)..."
sysctl_aviso = "⚠️ 部分 SYSCTL 参数无法应用（内核可能不支持）。"
optimizando_nic = "🔌 优化网卡："
sin_ethtool = "⚠️ 未安装 'ethtool'：已跳过网卡优化。"
persistencia = "💾 使网卡优化持久化 (UDEV + SYSTEMD)..."
configurando_dns = "🌐 配置 DNS（Cloudflare、Quad9、Google）并启用本地缓存..."
listo = "🔥 完成！网络优化已应用。可使用以下命令检查 DNS：resolvectl status"

# Sub-step: AI for development.
[ai]
instalado = "开发用 AI：模板已安装到"
models_creado = "MODELS.ENV 已创建（编辑你的 .GGUF 文件路径）："

[project]
name = "minimalistdots-rs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David-Peralta-Rd", email = "crdavidperalta@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "utils",
    "langs",
]

[project.scripts]
minimalistdots-rs = "minimalistdots_rs:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "utils",
    "langs",
]

[tool.uv.sources]
utils = { workspace = true }
langs = { workspace = true }

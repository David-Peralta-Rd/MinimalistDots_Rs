[tool.uv.workspace]
members = ["installer"]

[tool.uv]
prerelease = "disallow"
exclude-newer = "2026-11-02T00:00:00Z"  # cooldown 7 dias

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true

[tool.importlinter]
root_package = "installer"

[[tool.importlinter.contracts]]
name = "Los pasos no se importan entre si"
type = "independence"
modules = ["installer.steps.*"]
